function pick(e){const r=cv.getBoundingClientRect();mv.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mv,cam);const h=ray.intersectObjects(pickables())[0];return h?h.object.userData.mod:null}
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};moved=0;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved+=Math.abs(dx)+Math.abs(dy);drag={x:e.clientX,y:e.clientY};if(moved>4){tw=null;const o=cam.position.clone().sub(look),s=new THREE.Spherical().setFromVector3(o);s.theta-=dx*.006;s.phi=Math.max(.15,Math.min(1.5,s.phi-dy*.005));cam.position.copy(look).add(o.setFromSpherical(s))}}
 else{const h=pick(e);if(h!=hotId){hotId=h;cv.style.cursor=h?'pointer':'grab';refreshBoards()}}});
cv.addEventListener('pointerup',e=>{drag=null;if(moved<5){const h=pick(e);if(h)focus(h)}});
cv.addEventListener('wheel',e=>{e.preventDefault();tw=null;const o=cam.position.clone().sub(look),r=Math.max(6,Math.min(95,o.length()*(1+e.deltaY*.0012)));cam.position.copy(look).add(o.setLength(r))},{passive:false});
/* ── day / night / rain ── */
let night=0,nightT=0,rain=0;const SKY={d:new THREE.Color(0x9fd3f5),n:new THREE.Color(0x050912),r:new THREE.Color(0x76848f)},tmp=new THREE.Color();
$('bDay').onclick=()=>setNight(0);$('bNight').onclick=()=>setNight(1);
function setNight(n){nightT=n;$('bDay').classList.toggle('on',!n);$('bNight').classList.toggle('on',!!n)}
$('bRain').onclick=function(){rain=rain?0:1;this.classList.toggle('on',!!rain);rp.visible=!!rain};
const RN=1600,rg=new THREE.BufferGeometry(),ra=new Float32Array(RN*3);for(let i=0;i<RN;i++){ra[i*3]=Math.random()*90-35;ra[i*3+1]=Math.random()*30;ra[i*3+2]=Math.random()*70-30}
rg.setAttribute('position',new THREE.BufferAttribute(ra,3));const rp=new THREE.Points(rg,new THREE.PointsMaterial({color:0xaac8ff,size:.09,transparent:true,opacity:.65}));rp.visible=false;scene.add(rp);
let lastEI=-1;function env(dt){night+=(nightT-night)*Math.min(1,dt*2.5);const n=night,w=rain?.35:0;
 tmp.copy(SKY.d).lerp(SKY.r,w).lerp(SKY.n,n);scene.background=tmp.clone();scene.fog.color.copy(tmp).convertSRGBToLinear();const ei=1-.9*n;if(Math.abs(ei-lastEI)>.003){lastEI=ei;ENV.forEach(m=>m.envMapIntensity=ei)}
 hemi.intensity=.95-.7*n-.15*w;sun.intensity=(1.1-1.0*n)*(1-w);sun.color.set(n>.5?0x6b86c9:0xfff3dd);if(n>.5)sun.intensity=.22;
 glow.forEach(g=>g.m.emissiveIntensity=g.day+(g.night-g.day)*n);lamps.forEach((l,i)=>l.intensity=(i<3?1.1:.7)*n+(i>2?.25:0)*(1-n));
 if(rain){const a=rg.attributes.position;for(let i=0;i<RN;i++){a.array[i*3+1]-=26*dt;if(a.array[i*3+1]<0)a.array[i*3+1]=30}a.needsUpdate=true}}
/* ── main loop ── */
const sched=LIVE.map(e=>({e,n:Math.random()*3}));
let last=performance.now(),acc=0;
function size(){const w=root.clientWidth||innerWidth,h=root.clientHeight||innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',size);size();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;acc+=dt;
 sched.forEach(s=>{s.n-=dt;if(s.n<=0){s.e.run();s.n=s.e.every[0]+Math.random()*(s.e.every[1]-s.e.every[0])}});
 updateCars(dt);updateCustomers(dt);updatePeople(dt);env(dt);
 boards.forEach((b,i)=>{const k=1+Math.sin(T*3+i)*.08+(b.m.id==cur||b.m.id==hotId?.18:0);b.ring.scale.set(k,k,1);const z=(b.m.id==cur||b.m.id==hotId)?1.1:1;b.sp.scale.set(.34*z,.085*z,1)});
 if(tw){tw.t+=dt;const k=ease(Math.min(1,tw.t/tw.d));cam.position.lerpVectors(tw.p0,tw.p1,k);look.lerpVectors(tw.l0,tw.l1,k);if(tw.t>=tw.d)tw=null}
 cam.lookAt(look);if(acc>1.5&&!tw){acc=0;refresh()}R.render(scene,cam)}
for(let i=0;i<3;i++)setTimeout(spawnCar,i*2500);for(let i=0;i<4;i++)spawnCustomer();
// warm-up: compile every shader + upload every texture once, so camera moves never hitch
rp.visible=true;scene.traverse(o=>{o._fc=o.frustumCulled;o.frustumCulled=false});R.render(scene,cam);scene.traverse(o=>{o.frustumCulled=o._fc});rp.visible=false;
refresh();cv.style.cursor='grab';requestAnimationFrame(loop);
window.NizaScene={focus,home,setNight,state:S,data:DATA,config:CFG,open:id=>CFG.openModule(CFG.modules.find(m=>m.id==id).route),
 addEvent:(name,every,run)=>sched.push({e:{name,every,run},n:every[0]}),feed};
})();
